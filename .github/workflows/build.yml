name: Cross-Platform Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Opt-in to Node.js 24 for GitHub Actions runners to clear deprecation warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore necessary projects (Windows)
      run: |
        dotnet restore src/OpenDriverUpdater.Cli/OpenDriverUpdater.Cli.csproj
        dotnet restore tests/OpenDriverUpdater.Core.Tests/OpenDriverUpdater.Core.Tests.csproj
      
    - name: Build Core, Infrastructure & CLI (Windows)
      run: |
        dotnet build src/OpenDriverUpdater.Cli/OpenDriverUpdater.Cli.csproj --configuration Release --no-restore
        dotnet build tests/OpenDriverUpdater.Core.Tests/OpenDriverUpdater.Core.Tests.csproj --configuration Release --no-restore
      
    - name: Run Unit Tests (Windows)
      run: |
        dotnet test tests/OpenDriverUpdater.Core.Tests/OpenDriverUpdater.Core.Tests.csproj --configuration Release --no-build --verbosity normal

    - name: Publish CLI (Windows)
      run: |
        dotnet publish src/OpenDriverUpdater.Cli/OpenDriverUpdater.Cli.csproj --configuration Release --no-restore --output ./publish/cli-windows

    - name: Upload CLI Artifact (Windows)
      uses: actions/upload-artifact@v4
      with:
        name: OpenDriverUpdater-CLI-Windows
        path: ./publish/cli-windows/
        retention-days: 7

  build_linux_verification:
    name: Build Verification (Linux)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore Core & Tests (Linux)
      run: |
        dotnet restore src/OpenDriverUpdater.Core/OpenDriverUpdater.Core.csproj
        dotnet restore tests/OpenDriverUpdater.Core.Tests/OpenDriverUpdater.Core.Tests.csproj
        
    - name: Build & Test Core (Linux)
      run: |
        dotnet build tests/OpenDriverUpdater.Core.Tests/OpenDriverUpdater.Core.Tests.csproj --configuration Release
        dotnet test tests/OpenDriverUpdater.Core.Tests/OpenDriverUpdater.Core.Tests.csproj --configuration Release --no-build
      
    - name: Publish Core (Linux)
      run: |
        dotnet publish src/OpenDriverUpdater.Core/OpenDriverUpdater.Core.csproj --configuration Release --output ./publish/core-linux

    - name: Upload Core Artifact (Linux Verification)
      uses: actions/upload-artifact@v4
      with:
        name: OpenDriverUpdater-Core-Linux
        path: ./publish/core-linux/
        retention-days: 1

    - name: Note on Platform Limitations
      run: |
        echo "Note: WinUI 3, WMI, and PnP components (App, Infrastructure, CLI) require Windows and were skipped on this runner."
