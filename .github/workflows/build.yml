name: Cross-Platform Build & Test

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_windows:
    name: Build & Publish (Windows)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Publish App (Windows)
      run: |
        dotnet publish src/OpenDriverUpdater.App/OpenDriverUpdater.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/win-app
    - name: Upload Windows App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenDriverUpdater-Windows
        path: ./publish/win-app/OpenDriverUpdater.exe

  build_linux:
    name: Build & Publish (Linux CLI)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Publish CLI (Linux)
      run: |
        dotnet publish src/OpenDriverUpdater.Cli/OpenDriverUpdater.Cli.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/linux-cli
    - name: Upload Linux CLI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenDriverUpdater-Linux
        path: ./publish/linux-cli/odu

  create_release:
    name: Create GitHub Release
    needs: [build_windows, build_linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - name: Download Windows App
      uses: actions/download-artifact@v4
      with:
        name: OpenDriverUpdater-Windows
        path: ./release-assets/
    - name: Download Linux CLI
      uses: actions/download-artifact@v4
      with:
        name: OpenDriverUpdater-Linux
        path: ./release-assets/
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./release-assets/OpenDriverUpdater.exe
          ./release-assets/odu
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
